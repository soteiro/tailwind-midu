<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Soteiro.link</title>
  </head>
  <body
    class="bg-gradient-to-b mx-auto min-h-dvh from-sky-600 via-sky-950 to-gray-800 text-gray-300 items-center justify-center h-screen"
  >
    <header class="flex flex-col items-center justify-center mb-8 mt-4">
      <img
        class="h-[50vh] object-cover mask-radial-at-center mask-radial-from-45% mask-radial-to-80%"
        src="https://robohash.org/Soteiro.link"
        alt=""
      />
      <span
        class="text-sky-400 text-xl font-mono px-3 py-1 border border-sky-500/50 rounded-full flex items-center justify-center shadow-sm bg-black/65 cursor-crosshair z-10"
        >@Soteiro.link
        <svg
          class="ml-1 w-5 h-5 text-sky-400 inline"
          fill="currentColor"
          viewBox="0 0 20 20"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707a1 1 0 00-1.414-1.414L9 11.172l-1.293-1.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd"
          />
        </svg>
      </span>
      <h1 class="text-3xl font-bold leading-tight mt-1 font-display">
        Diego Ignacio Soto
      </h1>
    </header>
    <main>
      <!-- instagram -->
      <a href="https://instagram.com/soteiro">
        <svg width="24" height="24">
          <use xlink:href="./assets/sprite.svg#instagram/soteiro"></use>
        </svg>
      </a>

      <footer>
        <p>
          Hecho con amor por <a href="https://github.com/soteiro">Soteiro</a>
        </p>
      </footer>
    </main>
  </body>
</html>
